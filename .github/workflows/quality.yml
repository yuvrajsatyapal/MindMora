name: Runtime and UI quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime-and-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run api:check
      - run: npm run test:contract
      - run: npm run test:rate-limit
      - name: Real PostgreSQL and Redis note and knowledge API acceptance
        run: npm run test:notes
      - run: npm run test:db
      - run: npm run test:boundary
      - run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: mindmora-private-service-key-marker
          DATABASE_URL: postgresql://mindmora-private-database-marker
      - run: npm run test:startup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Authenticated browser and generated collection acceptance
        run: npm run test:auth
